<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juice Mixer — Frutex</title>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--green:#2E6F40;--green-dark:#1e4d2c;--white:#fff;--white-70:rgba(255,255,255,.7);--transition:.25s ease}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(180deg,#fdfcf9 0%,#f8faf6 30%,#f5f8f2 60%,#fafcf8 100%);-webkit-font-smoothing:antialiased;overflow-x:hidden;animation:fPage .5s ease both;position:relative}
    @keyframes fPage{from{opacity:0}to{opacity:1}}

    .bg-blob{position:fixed;pointer-events:none;z-index:0;border-radius:50%;filter:blur(120px);opacity:.04}
    .bg-blob-1{width:600px;height:600px;background:#2E6F40;top:-200px;left:-150px;animation:blobFloat 20s ease-in-out infinite}
    .bg-blob-2{width:500px;height:500px;background:#3d8a52;bottom:-150px;right:-100px;animation:blobFloat 25s ease-in-out infinite reverse}
    @keyframes blobFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.05)}66%{transform:translate(-20px,15px) scale(.95)}}

    .navbar{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:1000;animation:nIn .7s cubic-bezier(.22,1,.36,1) both;width:82vw;max-width:1050px;border-radius:40px;background:rgba(255,255,255,.12);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.15);box-shadow:0 8px 32px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.1)}
    .navbar__inner{display:flex;align-items:center;justify-content:space-between;gap:40px;padding:10px 36px;height:56px;width:100%}
    .navbar__logo{display:flex;align-items:center;flex-shrink:0;text-decoration:none;transition:transform var(--transition)}.navbar__logo:hover{transform:scale(1.05)}.navbar__logo svg{height:30px;width:auto}
    .navbar__nav{display:flex;align-items:center}.navbar__list{display:flex;align-items:center;list-style:none;gap:6px}
    .navbar__link{display:flex;align-items:center;gap:5px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--white-70);text-decoration:none;border-radius:20px;background:none;border:none;cursor:pointer;font-family:inherit;white-space:nowrap;letter-spacing:.01em;position:relative;transition:color .25s ease,background .25s ease}
    .navbar__link::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%) scaleX(0);width:60%;height:2px;background:var(--white);border-radius:1px;transition:transform .25s ease}
    .navbar__link:hover{color:var(--white)}.navbar__link:hover::after{transform:translateX(-50%) scaleX(1)}
    .navbar__link.active{color:var(--white);background:rgba(46,111,64,.7)}.navbar__link.active::after{display:none}
    .navbar__chevron{flex-shrink:0;transition:transform var(--transition);opacity:.5}.navbar__dropdown.open .navbar__chevron{transform:rotate(180deg);opacity:1}
    .navbar__dropdown{position:relative}
    .navbar__dropdown-menu{position:absolute;top:calc(100%+10px);left:50%;transform:translateX(-50%);min-width:200px;padding:8px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-radius:14px;list-style:none;opacity:0;visibility:hidden;pointer-events:none;box-shadow:0 12px 40px rgba(0,0,0,.15)}
    .navbar__dropdown.open .navbar__dropdown-menu{opacity:1;visibility:visible;pointer-events:auto}
    .navbar__dropdown-link{display:block;padding:10px 14px;font-size:13.5px;font-weight:500;color:#333;text-decoration:none;border-radius:8px;transition:transform .15s ease,background var(--transition),color var(--transition)}
    .navbar__dropdown-link:hover{background:rgba(46,111,64,.1);color:var(--green);transform:translateX(4px)}
    .navbar__hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;width:34px;height:34px;padding:6px;background:none;border:none;cursor:pointer;z-index:1001}
    .navbar__hamburger-line{display:block;width:100%;height:2px;background:var(--white);border-radius:2px;transition:transform var(--transition),opacity var(--transition)}
    @keyframes nIn{from{transform:translateX(-50%) translateY(-120%);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

    .page{padding-top:0}

    /* Hero */
    .mixer-hero{position:relative;height:35vh;min-height:220px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#1a3a28 0%,#2E6F40 40%,#1a4526 80%,#0f2418 100%)}
    .mixer-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(255,200,100,.08) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(46,200,100,.06) 0%,transparent 50%)}
    .mixer-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,15,5,.15) 0%,rgba(0,0,0,.3) 100%)}
    .mixer-hero-content{position:relative;z-index:1;text-align:center;padding:0 32px;animation:fIn .8s ease both}
    .mixer-hero-badge{display:inline-block;padding:8px 20px;background:rgba(46,111,64,.3);border:1px solid rgba(255,255,255,.15);color:#d4e8d0;border-radius:30px;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-bottom:24px}
    .mixer-hero h1{font-family:Georgia,serif;font-size:clamp(2rem,5vw,3.2rem);color:#f5ead6;font-weight:700;line-height:1.05;margin-bottom:10px}
    .mixer-hero p{font-size:0.95rem;color:rgba(255,255,255,.7);max-width:480px;margin:0 auto 16px;line-height:1.5}
    @keyframes fIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

    /* How to Play */
    .how-to-play{max-width:900px;margin:0 auto;padding:40px 32px 20px}
    .how-to-play h2{font-family:Georgia,serif;font-size:1.5rem;color:#1a1a1a;text-align:center;margin-bottom:24px}
    .how-to-play h2 span{color:var(--green)}
    .htp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .htp-card{background:#fff;border-radius:14px;padding:16px 14px;text-align:center;box-shadow:0 1px 8px rgba(0,0,0,.04);transition:transform .3s}
    .htp-card:hover{transform:translateY(-3px)}
    .htp-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin:0 auto 12px}
    .htp-card h3{font-size:.9rem;color:#111;margin-bottom:6px}
    .htp-card p{font-size:.8rem;color:#888;line-height:1.5}

    /* Game Area */
    .mixer-area{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:linear-gradient(180deg,#f8faf7 0%,#f0f5ef 40%,#eaf0e8 100%)}
    .mixer-frame{width:95%;max-width:800px;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(46,111,64,.08);border-radius:32px;box-shadow:0 2px 4px rgba(0,0,0,.03),0 8px 32px rgba(46,111,64,.06),0 20px 60px rgba(0,0,0,.04);padding:20px 28px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative}
    .game-scoreboard{display:flex;justify-content:space-evenly;width:100%;padding:8px 0;background:linear-gradient(135deg,rgba(46,111,64,.04),rgba(46,111,64,.02));border-radius:16px}
    .game-score,.game-timer{display:flex;flex-direction:column;align-items:center;gap:2px}
    .game-score-label{font-size:.7rem;color:#aaa;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
    .game-score-val{font-family:Georgia,serif;font-size:2rem;font-weight:700;color:#111}
    .game-score-val.pop{animation:sPop .4s cubic-bezier(.34,1.56,.64,1)}
    .game-timer .game-score-val{color:var(--green)}
    @keyframes sPop{0%{transform:scale(1)}30%{transform:scale(1.35)}100%{transform:scale(1)}}
    
    .game-target{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;min-height:110px}
    .game-target-label{font-size:.75rem;color:#999;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:8px}
    .game-target img{max-height:100px;object-fit:contain;border-radius:8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.1))}

    .game-blender{position:relative;padding:8px 0;will-change:transform;transform:translateZ(0)}
    .game-blender svg{filter:none;transform:translateZ(0)}
    
    .fruit-in-blender{position:absolute;font-size:1.5rem;pointer-events:none;z-index:4;transition:opacity .25s}
    .fruit-in-blender.spinning{animation:fSpin 2s ease-in forwards}
    @keyframes fSpin{0%{transform:rotate(0deg) translate(0,0);opacity:1}20%{transform:rotate(90deg) translate(-3px,-8px);opacity:1}40%{transform:rotate(200deg) translate(-6px,-18px);opacity:.9}60%{transform:rotate(340deg) translate(-4px,-30px);opacity:.5}80%{transform:rotate(480deg) translate(-2px,-45px);opacity:.15}100%{transform:rotate(600deg) translate(0,-60px);opacity:0}}

    .fruit-drop{position:absolute;font-size:1.6rem;pointer-events:none;animation:fdDrop .8s cubic-bezier(.5,.05,.6,.75) forwards;z-index:3;top:5px}
    @keyframes fdDrop{0%{transform:translateY(-100px) scale(.3);opacity:0}15%{opacity:1}50%{transform:translateY(0) scale(1.1)}65%{transform:translateY(-8px) scale(.95)}80%{transform:translateY(0) scale(1.03)}100%{transform:translateY(0) scale(1);opacity:1}}

    .liquid-swirl{position:absolute;top:50%;left:50%;width:90px;height:70px;margin-left:-45px;margin-top:-25px;border-radius:50%;pointer-events:none;opacity:0;z-index:2}
    .liquid-swirl.active{animation:swirlAnim 2.5s ease-out forwards;background:radial-gradient(ellipse at 40% 50%,rgba(46,200,100,.6) 0%,rgba(46,200,100,.2) 40%,transparent 70%)}
    @keyframes swirlAnim{0%{opacity:0;transform:scale(.2) rotate(0deg)}20%{opacity:.7;transform:scale(.8) rotate(90deg)}50%{opacity:.9;transform:scale(1.1) rotate(270deg)}80%{opacity:.5;transform:scale(1.05) rotate(450deg)}100%{opacity:.1;transform:scale(.95) rotate(540deg)}}

    .blender-finished{position:absolute;top:200px;left:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;transition:opacity .4s;z-index:7}
    .blender-finished.show{opacity:1;animation:juicePop .6s ease}
    @keyframes juicePop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}60%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

    .finished-juice{position:relative;width:65px;height:68px;border-radius:0 0 18px 18px;box-shadow:inset 0 4px 12px rgba(255,255,255,.3),0 4px 16px rgba(0,0,0,.15)}
    .finished-juice::before{content:'';position:absolute;top:8px;left:10%;width:40%;height:15px;background:rgba(255,255,255,.35);border-radius:50%;transform:rotate(-10deg)}
    .finished-juice::after{content:'';position:absolute;top:4px;right:15%;width:20%;height:8px;background:rgba(255,255,255,.25);border-radius:50%;transform:rotate(-5deg)}

    .game-blend-btn{display:inline-flex;align-items:center;gap:10px;padding:16px 40px;background:linear-gradient(135deg,#4a9e5e 0%,#2E6F40 40%,#1a4526 100%);color:#fff;border:none;border-radius:60px;font-weight:700;font-size:1.1rem;cursor:pointer;transition:all .3s cubic-bezier(.34,1.56,.64,1);font-family:inherit;box-shadow:0 6px 24px rgba(46,111,64,.35),0 2px 6px rgba(0,0,0,.1);letter-spacing:.02em;position:relative;overflow:hidden}
    .game-blend-btn::before{content:'';position:absolute;inset:0;border-radius:60px;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 60%);pointer-events:none}
    .game-blend-btn:hover:not(:disabled){transform:translateY(-3px) scale(1.04);box-shadow:0 12px 36px rgba(46,111,64,.5)}
    .game-blend-btn:active:not(:disabled){transform:scale(.97)}
    .game-blend-btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.3)}
    .blend-icon{font-size:1.3rem;transition:transform .3s}
    .game-blend-btn:not(:disabled):hover .blend-icon{transform:rotate(-20deg)}

    .game-feedback{font-weight:700;font-size:.95rem;min-height:28px;transition:all .3s}
    .game-feedback.success{color:var(--green);animation:fbBounce .5s cubic-bezier(.34,1.56,.64,1)}
    .game-feedback.error{color:#e74c3c;animation:fbShake .5s ease}
    @keyframes fbBounce{0%,100%{transform:scale(1)}40%{transform:scale(1.2)}}
    @keyframes fbShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

    .game-fruits{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:4px 0;max-width:100%}
    .fruit-btn{display:flex;flex-direction:row;align-items:center;gap:5px;padding:8px 12px;background:#fff;border:1.5px solid rgba(46,111,64,.08);border-radius:14px;cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);font-family:inherit;white-space:nowrap;flex:0 1 auto;min-width:fit-content}
    .fruit-btn:hover{border-color:rgba(46,111,64,.25);background:rgba(46,111,64,.04);transform:translateY(-3px);box-shadow:0 6px 20px rgba(46,111,64,.08)}
    .fruit-btn:active{transform:scale(.94)}
    .fruit-btn.selected{border-color:var(--green);background:rgba(46,111,64,.12);box-shadow:0 4px 12px rgba(46,111,64,.1)}
    .fruit-emoji{font-size:1.4rem;line-height:1}
    .fruit-name{font-size:.65rem;color:#999;font-weight:600;text-transform:uppercase;letter-spacing:.03em}

    .game-overlay{position:absolute;inset:0;background:rgba(0,0,0,.78);border-radius:32px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;z-index:20;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:overlayIn .4s ease}
    @keyframes overlayIn{from{opacity:0}to{opacity:1}}
    .game-overlay h2{font-family:Georgia,serif;color:#f5ead6;font-size:2rem;margin:0}
    .game-overlay p{color:rgba(255,255,255,.6);margin:0;font-size:.95rem}
    .game-overlay-btn{display:inline-flex;align-items:center;gap:8px;padding:16px 36px;background:#f5ead6;color:#2E6F40;border:none;border-radius:60px;font-weight:600;font-size:1rem;cursor:pointer;font-family:inherit;transition:all .3s cubic-bezier(.34,1.56,.64,1);text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,.15)}
    .game-overlay-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
    .game-overlay-btn:active{transform:scale(.96)}
    .game-overlay.high-score{background:rgba(0,30,15,.88)}
    .game-overlay.high-score h2{animation:celebrate .6s cubic-bezier(.34,1.56,.64,1);font-size:2.4rem}
    @keyframes celebrate{0%,100%{transform:scale(1)}30%{transform:scale(1.25)}60%{transform:scale(.93)}}

    .game-blender.motor-on{animation:blVibrate .15s ease-in-out infinite;will-change:transform}
    @keyframes blVibrate{0%,100%{transform:translate(0,0)}25%{transform:translate(-.4px,.2px)}50%{transform:translate(.4px,-.2px)}75%{transform:translate(-.2px,.4px)}}
    .game-blender.motor-on .blade-spin{animation:bladeSpin .15s linear infinite;transform-origin:110px 295px;will-change:transform}
    @keyframes bladeSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

    .pitcher-lid{position:absolute;top:117px;left:50%;transform:translate(-50%,0);width:60px;height:28px;border-radius:30px 30px 10px 10px;background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.6));border:2px solid rgba(255,255,255,.15);pointer-events:none;z-index:6;transition:all .8s cubic-bezier(.34,1.56,.64,1);box-shadow:0 6px 16px rgba(0,0,0,.25)}
    .pitcher-lid.open{transform:translate(-50%,-50px) rotate(30deg);opacity:0}
    .pitcher-lid.closed{transform:translate(-50%,-3px) rotate(0deg);opacity:1}

    @media(max-width:768px){.htp-grid{grid-template-columns:1fr}.mixer-frame{padding:24px 16px 20px;gap:14px}}
    @media(max-width:500px){.game-fruits{gap:4px}.fruit-btn{padding:6px 8px}.fruit-emoji{font-size:1.2rem}.fruit-name{font-size:.6rem}.mixer-hero{height:40vh}.mixer-area{padding:40px 12px}.game-blend-btn{padding:14px 28px;font-size:1rem}}
    @media(max-width:960px){.navbar{top:12px;border-radius:28px;width:90vw}.navbar__inner{padding:8px 20px;height:48px}.navbar__logo svg{height:24px}.navbar__hamburger{display:flex}.navbar__nav{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);backdrop-filter:blur(20px);flex-direction:column;justify-content:center;align-items:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity var(--transition),visibility var(--transition);z-index:1000}.navbar__nav.open{opacity:1;visibility:visible;pointer-events:auto}.navbar__list{flex-direction:column;gap:8px;align-items:center}.navbar__link{font-size:17px;padding:12px 20px}.navbar__link:hover{background:rgba(255,255,255,.1)}.navbar__link.active{background:rgba(46,111,64,.7)}.navbar__dropdown-menu{position:static;transform:none;min-width:unset;background:transparent;box-shadow:none;padding:4px 0;opacity:1;visibility:visible;pointer-events:auto;display:none;animation:none}.navbar__dropdown.open .navbar__dropdown-menu{display:block}.navbar__dropdown-link{color:rgba(255,255,255,.7);font-size:15px;text-align:center}.navbar__dropdown-link:hover{background:rgba(255,255,255,.1);color:var(--white);transform:none}}
  </style>
</head>
<body>
<svg class="juice-bg" xmlns="http://www.w3.org/2000/svg" style="position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.12" viewBox="0 0 1920 1080">
  <defs>
    <filter id="bgBlur1"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="bgBlur2"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="bgBlur3"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="#faf9f4"/>
  <rect width="1920" height="1080" fill="url(#warmGlow)" opacity=".15"/>
  <rect width="1920" height="1080" fill="url(#greenGlow)" opacity=".1"/>
  <g transform="translate(120,150) rotate(-15)" filter="url(#bgBlur1)" opacity=".8"><circle cx="0" cy="0" r="65" fill="#ffb347" stroke="#ff8c00" stroke-width="2"/><circle cx="0" cy="0" r="55" fill="none" stroke="#ffcc80" stroke-width="1"/><circle cx="0" cy="0" r="8" fill="#ffe0b2"/><line x1="0" y1="-55" x2="0" y2="55" stroke="#ff9800" stroke-width="1.5" opacity=".5"/><line x1="-55" y1="0" x2="55" y2="0" stroke="#ff9800" stroke-width="1.5" opacity=".5"/><line x1="-39" y1="-39" x2="39" y2="39" stroke="#ff9800" stroke-width="1.5" opacity=".5"/><line x1="-39" y1="39" x2="39" y2="-39" stroke="#ff9800" stroke-width="1.5" opacity=".5"/></g>
  <g transform="translate(1750,200) rotate(25)" filter="url(#bgBlur1)" opacity=".7"><circle cx="0" cy="0" r="55" fill="#ffb347" stroke="#ff8c00" stroke-width="2"/><circle cx="0" cy="0" r="46" fill="none" stroke="#ffcc80" stroke-width="1"/><circle cx="0" cy="0" r="6" fill="#ffe0b2"/><line x1="0" y1="-46" x2="0" y2="46" stroke="#ff9800" stroke-width="1.5" opacity=".5"/><line x1="-46" y1="0" x2="46" y2="0" stroke="#ff9800" stroke-width="1.5" opacity=".5"/></g>
  <g transform="translate(1700,800) rotate(-30)" filter="url(#bgBlur1)" opacity=".75"><circle cx="0" cy="0" r="50" fill="#fff9c4" stroke="#fdd835" stroke-width="2"/><circle cx="0" cy="0" r="42" fill="none" stroke="#ffee58" stroke-width="1"/><circle cx="0" cy="0" r="5" fill="#fffde7"/><line x1="0" y1="-42" x2="0" y2="42" stroke="#f9a825" stroke-width="1" opacity=".4"/><line x1="-42" y1="0" x2="42" y2="0" stroke="#f9a825" stroke-width="1" opacity=".4"/></g>
  <g transform="translate(250,850) rotate(40)" filter="url(#bgBlur2)" opacity=".5"><circle cx="0" cy="0" r="40" fill="#fff9c4" stroke="#fdd835" stroke-width="1.5"/><circle cx="0" cy="0" r="4" fill="#fffde7"/></g>
  <g transform="translate(100,500) rotate(10)" filter="url(#bgBlur1)" opacity=".7"><circle cx="0" cy="0" r="45" fill="#aed581" stroke="#7cb342" stroke-width="1.5"/><circle cx="0" cy="0" r="38" fill="none" stroke="#c5e1a5" stroke-width="1"/><circle cx="0" cy="0" r="5" fill="#f1f8e9"/><line x1="0" y1="-38" x2="0" y2="38" stroke="#8bc34a" stroke-width=".8" opacity=".5"/><line x1="-38" y1="0" x2="38" y2="0" stroke="#8bc34a" stroke-width=".8" opacity=".5"/></g>
  <g transform="translate(1800,550) rotate(-20)" filter="url(#bgBlur2)" opacity=".5"><circle cx="0" cy="0" r="35" fill="#aed581" stroke="#7cb342" stroke-width="1"/><circle cx="0" cy="0" r="4" fill="#f1f8e9"/></g>
